<!DOCTYPE html>
<html lang="ja">

<head>

    <title>BlueMoon</title>
    <link rel="stylesheet" href="assets/CSS/normalize.css">
    <link rel="stylesheet" href="assets/CSS/style.css">
    <style>
        .hamburger {
            /* position: fixed; */
            top: 20px;
            right: 20px;
            width: 40px;
            height: 30px;
            cursor: pointer;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .hamburger span {
            display: block;
            width: 100%;
            height: 4px;
            background: white;
            transition: 0.4s;
        }

        #nav_menu {
            position: fixed;
            top: 0;
            right: -300px;
            width: 300px;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            transition: 0.5s;
            z-index: 9000;
            padding-top: 80px;
        }

        #nav_menu.open {
            right: 0;
        }

        #nav_menu ul {
            list-style: none;
            padding: 0;
        }

        #nav_menu li {
            padding: 20px;
            text-align: center;
        }

        #nav_menu a {
            color: white;
            text-decoration: none;
            font-size: 22px;
            font-family: serif;
            display: block;
        }

        #nav_menu a:hover {
            color: #8C1A1C;
        }

        .hamburger.active span:nth-child(1) {
            transform: translateY(13px) rotate(45deg);
        }

        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.active span:nth-child(3) {
            transform: translateY(-13px) rotate(-45deg);
        }
    </style>
</head>

        @media screen and (max-width:768px) {

            }

    <script>
        function toggleMenu() {
            const menu = document.getElementById('nav_menu');
            const hamburger = document.querySelector('.hamburger');
            if (menu && hamburger) {
                menu.classList.toggle('open');
                hamburger.classList.toggle('active');
            }
        }
    </script>
