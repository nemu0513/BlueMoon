<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlueMoon</title>
    <link rel="stylesheet" href="assets/CSS/normalize.css">
    <link rel="stylesheet" href="assets/CSS/special.css">
    <!-- フォント -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP&family=Playfair+Display+SC:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Shippori+Mincho+B1&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <div class="header_img">
            <div class="h">
                <img class="title" src="assets/img/title.png">
                <!-- ハンバーガーメニュー -->
                <div class="hamburger" onclick="toggleMenu()">
                    <span></span><span></span><span></span>
                </div>
            </div>
        </div>

        <nav id="nav_menu">
            <ul>
                <li><a href=index.html target="=_self" onclick="toggleMenu()">TOP</a></li>
                <li><a href="story.html" target="_self" onclick="toggleMenu()">STORY</a></li>
                <li><a href="character.html" target="_self" onclick="toggleMenu()">CHARACTER</a></li>
                <li><a href="system.html" target="_self" onclick="toggleMenu()">SYSTEM</a></li>
                <li><a href="special.html" target="_self" onclick="toggleMenu()">SPECIAL</a></li>
            </ul>
        </nav>
    </header>
    <div class="special">
        <div class="grad">
            <div class="main_container">
                <div class="benefits_box1">
                    <p class="b_main">購入者特典</p>
                    <div class="benefits">
                        <img class="b_img" src="assets/img/b1.png">
                        <div class="b_box">
                            <p class="b_text">ゲームクリア後に表示されるパスワードを入力することで
                                <br>
                                書き下ろし壁紙を入手することができます。
                            </p>
                            <div class="input-area">
                                <input typea="text" id="serialCode" placeholder="例:1234-5678" spellcheck="false">
                                <button id="unlockBtn">特典をアンロック！</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="benefits_box2">
                    <p class="b_main">応援バナー</p>
                    <div class="benefits_list">
                        <ul>
                            <li><img src="assets/img/cb1.png"></li>
                            <li><img src="assets/img/cb2.png"></li>
                            <li><img src="assets/img/cb3.png"></li>
                            <li><img src="assets/img/cb3.png"></li>
                            <li><img src="assets/img/cb3.png"></li>
                            <li><img src="assets/img/cb3.png"></li>
                            <li><img src="assets/img/cb3.png"></li>
                        </ul>
                    </div>
                </div>
                <div id="rewardModal" class="modal-overlay">
                    <div class="modal-content">
                        <div class="congrats-text">CONGRATULATIONS!</div>
                        <p class="reward-desc">限定デジタルイラストをアンロックしました</p>

                        <div class="image-wrapper">
                            <img src="assets/img/rw.png" alt="特典画像" id="rewardImage">
                        </div>
                        <button class="close-btn" id="closeBtn">閉じる</button>
                    </div>
                </div>

                <script>
                    function toggleMenu() {
                        const menu = document.getElementById('nav_menu');
                        const hamburger = document.querySelector('.hamburger');
                        if (menu && hamburger) {
                            menu.classList.toggle('open');
                            hamburger.classList.toggle('active');
                        }
                    }

                    const unlockBtn = document.getElementById('unlockBtn');
                    const closeBtn = document.getElementById('closeBtn');
                    const modal = document.getElementById('rewardModal');
                    const serialInput = document.getElementById('serialCode');

                    unlockBtn.onclick = function () {
                        const code = serialInput.value.trim();

                        if (code === "aaaaa") {
                            modal.style.display = 'block';
                            console.log("特典が解放されました！");
                        } else {
                            alert("コードを入力してください！");
                        }
                    };

                    closeBtn.onclick = function () {
                        modal.style.display = 'none';
                        serialInput.value = "";
                    };

                    window.onclick = function (event) {
                        if (event.target == modal) {
                            modal.style.display = "none";
                        }
                    };
                </script>
            </div>
        </div>
    </div>
    </div>
    </div>

    <footer>
        <img class="st" src="assets/img/steam.png">
        <p>&copy; 2026 N.H All Rights Reserved.</p>
    </footer>
</body>

</html>
